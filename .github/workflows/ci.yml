# Check each push and each pull request: types, unit tests, the test in VS Code,
# and the packaged extension in a clean VS Code profile.
#
# NOT VERIFIED: this repository has no remote, so this workflow never ran.
#
# The job uses macOS because the test scripts start VS Code from
# "/Applications/Visual Studio Code.app".
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install VS Code
        run: brew install --cask visual-studio-code

      # --ignore-scripts: no package of this project needs an install script.
      - name: Install the packages
        run: npm ci --ignore-scripts

      # Type check, unit tests, and the test of the full extension in a VS Code window.
      - name: Test
        run: npm test

      # Build the .vsix file, install it in an empty VS Code profile, and run the same steps on the installed copy.
      - name: Test the packaged extension
        run: npm run test:vsix

      - name: Show the VS Code log if a test failed
        if: failure()
        run: tail -n 100 .vscode-test/vscode.log .vscode-test/vsix/vscode.log || true

      - uses: actions/upload-artifact@v4
        with:
          name: dbx-notebook-vsix
          path: "*.vsix"
