<!DOCTYPE html>
<!--
  The test page: it shows a board of "Visualize Table" in a normal browser, with the demo tables.

  `npm run build` copies this file and themes.css to dist/harness, and makes harness.js and
  harness.css there. Serve that folder with a local web server, then open the page. Example:

      http://localhost:8791/index.html?theme=light&cards=amount

  test/README.md, section "See a board in a browser", has the command that starts the server.
  shim.ts lists the parameters of the page URL.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- The same policy as the webview in VS Code. 'self' replaces the nonce and the VS Code resource address. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="themes.css">
<link rel="stylesheet" href="harness.css">
<title>Table visualization test page</title>
</head>
<body>
<div id="root"></div>
<script src="harness.js"></script>
</body>
</html>
